<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema DESTINO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div id="root"></div>

    <script type="text/babel">
        function App() {
            return (
                <div class="text-center bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700 max-w-md w-full">
                    <h1 class="text-3xl font-bold text-blue-400 mb-2">Sistema DESTINO</h1>
                    <p class="text-slate-300 mb-6">A tua plataforma está online e pronta!</p>
                    <div class="bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg cursor-pointer transition">
                        Aceder ao Painel
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
