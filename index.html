<!DOCTYPE html>
<html lang="pt">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agência DESTINO | Marketing e Soluções Digitais em Angola</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [isAdmin, setIsAdmin] = React.useState(window.location.hash === '#gestao');

            React.useEffect(() => {
                const handleHashChange = () => {
                    setIsAdmin(window.location.hash === '#gestao');
                };
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
            }, []);

            // ÁREA RESTRITA: Apenas para Gestores da DESTINO (Acede via sistema-destino.vercel.app/#gestao)
            if (isAdmin) {
                return (
                    <div className="p-6 max-w-6xl mx-auto min-h-screen flex flex-col justify-between">

                                    <h1 className="text-2xl font-bold text-white mt-2">Painel de Controlo Interno</h1>
                                </div>
                                <a 
                                    href="#"
                                    onClick={() => { window.location.hash = ''; window.location.reload(); }}
                                    className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg text-sm transition border border-slate-700"
                                >
                                    Sair para o Site Público
                                </a>
                            </div>
                            <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl space-y-6">

                                    <span className="bg-slate-800 text-slate-300 hover:bg-slate-700 px-3 py-1 rounded-full text-xs font-semibold cursor-pointer border border-slate-700">Novos Clientes</span>
                                    <span className="bg-slate-800 text-slate-300 hover:bg-slate-700 px-3 py-1 rounded-full text-xs font-semibold cursor-pointer border border-slate-700">Em Atendimento</span>
                                </div>
                                <div className="bg-slate-950 p-5 rounded-xl border border-slate-800/80 text-slate-300 text-sm space-y-2">
                                    <p className="font-semibold text-blue-400">Estado Operacional:</p>
                                    <p>Sistema de gestão de clientes, filtragem e automação de marketing operando sem falhas em Angola.</p>
                                </div>
                            </div>
                        </div>
                        <footer className="text-center text-slate-600 text-xs py-4">
                            Agência DESTINO — Acesso restrito autorizado apenas a administradores.
                        </footer>
                    </div>
                );
            }

            // PÁGINA PÚBLICA: O que os clientes externos veem ao entrar no link principal
            return (
                <div className="min-h-screen flex flex-col justify-between">
                    {/* Header Institucional Limpo */}
                    <header className="p-6 max-w-6xl mx-auto w-full flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <h1 className="text-xl font-extrabold tracking-wider text-blue-500">DESTINO</h1>
                            <span className="text-xs bg-blue-600/20 text-blue-400 border border-blue-500/30 px-2.5 py-0.5 rounded-full font-medium hidden sm:inline-block">Angola</span>
                        </div>
                        <div>
                            <a 
                                href="https://wa.me/" 
                                target="_blank" 
                                className="text-xs bg-blue-600 hover:bg-blue-500 text-white font-semibold px-4 py-2 rounded-xl transition shadow-lg shadow-blue-600/20"
                            >
                                Falar no WhatsApp
                            </a>
                        </div>
                    </header>

                    {/* Hero Principal */}
                    <main className="max-w-6xl mx-auto px-6 py-12 grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                        <div className="space-y-6">
                            <h2 className="text-4xl md:text-5xl font-extrabold tracking-tight text-white leading-tight">
                                Chega de rasgar dinheiro com <span className="text-orange-500">marketing que não vende.</span>
                            </h2>
                            <p className="text-slate-300 text-base md:text-lg leading-relaxed">
                                A equipa da DESTINO desenvolveu a solução definitiva para o mercado angolano: por apenas <strong className="text-white">30.000 Kz/mês</strong>, tens uma Inteligência Artificial completa que cria artes fiéis à tua marca, gera textos de vendas adaptados ao público local, otimiza Anúncios Patrocinados e faz a gestão de conteúdo e conversão 24/7.
                            </p>
                            
                            <div className="flex flex-col sm:flex-row gap-4 pt-2">

                                    href="https://wa.me/" 
                                    target="_blank" 
                                    className="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3.5 px-6 rounded-xl shadow-lg shadow-emerald-600/20 text-center transition"

                                >
                                    Ver Cursos e Mentorias 📚
                                </a>
                            </div>

                            <p className="text-xs text-slate-400 flex items-center gap-2 pt-2">
                                🛡️ Garantia incondicional DESTINO de 7 dias ou o teu dinheiro de volta.
                            </p>
                        </div>

                        {/* Bloco de Demonstração Comercial */}
                        <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl space-y-4">
                            <div className="flex justify-between items-center text-xs text-slate-400 border-b border-slate-800 pb-3">
                                <span>Plataforma DESTINO — IA Ativa</span>
                                <span className="text-emerald-400">● Online em Luanda</span>
                            </div>
                            <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                                <p className="text-sm font-bold text-white">Criação de Conteúdo & Branding</p>
                                <p className="text-xs text-slate-400">Artes adaptadas ao seu Brand Kit com precisão.</p>
                            </div>
                            <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-1 text-xs">
                                <p className="text-slate-400 font-semibold">Desempenho de Anúncios</p>
                                <p className="text-emerald-400 font-bold">CTR 4.8% &nbsp;&nbsp; CPA 320 Kz &nbsp;&nbsp; ROAS 3.6x</p>
                            </div>
                            <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs space-y-1">
                                <p className="text-slate-400">💬 Gestão de Leads & WhatsApp</p>
                                <p className="text-slate-300 italic">"Como funcionam os pacotes para empresas?"</p>
                                <p className="text-emerald-400 font-semibold pt-1">Resposta automática configurada ✓</p>
                            </div>
                        </div>
                    </main>

                    {/* Rodapé Institucional */}
                    <footer className="p-6 border-t border-slate-900 text-center text-slate-500 text-sm">
                        <p>&copy; 2026 Agência DESTINO. Todos os direitos reservados.</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
